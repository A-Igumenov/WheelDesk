[package]
name = "wheeldesk-core"
description = "OS-independent core of WheelDesk: volumes, settings, library, audio (later)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.37", default-features = false, features = ["disk"] }
directories = "6"
thiserror = "2"
lofty = "0.22"
rayon = "1"
walkdir = "2"
base64 = "0.22"
encoding_rs = "0.8"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
rodio = { version = "0.21", default-features = false, features = ["playback", "symphonia-all"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
